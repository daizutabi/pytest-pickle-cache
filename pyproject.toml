[build-system]
requires = ["uv_build"]
build-backend = "uv_build"

[project]
name = "pytest-pickle-cache"
version = "0.1.3"
description = "A pytest plugin for caching test results using pickle."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "daizutabi", email = "daizutabi@gmail.com" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python",
  "Topic :: Software Development :: Testing",
]
requires-python = ">=3.10"
dependencies = ["pytest>=9"]

[project.urls]
Documentation = "https://github.com/daizutabi/pytest-pickle-cache"
Source = "https://github.com/daizutabi/pytest-pickle-cache"
Issues = "https://github.com/daizutabi/pytest-pickle-cache/issues"

[project.entry-points.pytest11]
pickle_cache = "pytest_pickle_cache.plugin"

[dependency-groups]
dev = [
  "basedpyright>=1.37.4",
  "pandas>=2",
  "pandas-stubs>=3.0.0.260204",
  "prek>=0.3.1",
  "pytest-cov>=6.0",
  "ruff>=0.15.0",
]

[tool.pytest]
addopts = ["--cov=pytest_pickle_cache", "--cov-report=lcov:lcov.info"]

[tool.coverage.report]
exclude_lines = ["if TYPE_CHECKING:"]
skip_covered = true

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
preview = true
select = ["ALL"]
unfixable = ["F401"]
ignore = [
  "CPY001",
  "D100",
  "D104",
  "D203",
  "D213",
  "D401",
  "DOC201",
  "S301",
  "S403",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "ARG", "D", "PLC2701", "PLR2004", "PT011", "S", "SLF001"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.basedpyright]
include = ["src", "tests"]
reportAny = false
reportExplicitAny = false
reportUnusedCallResult = false
